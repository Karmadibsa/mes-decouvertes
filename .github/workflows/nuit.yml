name: Découvertes du jour

on:
  # GitHub retarde souvent les tâches planifiées de plusieurs heures : on lance la veille au soir,
  # avec un second essai dans la nuit (sans effet si le lot du jour existe déjà).
  schedule:
    - cron: "5 21 * * *"   # 22 h 05 ou 23 h 05 à Paris
    - cron: "0 1 * * *"    # 2 h ou 3 h à Paris
  workflow_dispatch:       # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write          # uniquement pour le commit anti-mise-en-veille ci-dessous

concurrency:
  group: decouvertes
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Récupérer le dépôt privé des articles
        uses: actions/checkout@v4
        with:
          repository: Karmadibsa/mes-decouvertes-articles
          ssh-key: ${{ secrets.CLE_DEPOT_ARTICLES }}
          path: sortie

      - name: Choisir et préparer les articles
        env:
          DECOUVERTES_LOG: WARNING
        run: >
          python generer.py --sortie sortie
          --url-base https://raw.githubusercontent.com/Karmadibsa/mes-decouvertes-articles/main
          --jour "$(TZ=Europe/Paris date -d '+6 hours' +%F)"

      - name: Publier (un seul commit, pour que le dépôt reste léger)
        working-directory: sortie
        run: |
          git config user.name "mes-decouvertes"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan publication
          git add -A
          git commit -q -m "Découvertes du $(TZ=Europe/Paris date -d '+6 hours' +%F)"
          git push -q -f origin publication:main

      # GitHub met en veille les tâches planifiées d'un dépôt public sans commit depuis 60 jours.
      - name: Éviter la mise en veille
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "mes-decouvertes"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q --allow-empty -m "Maintien de la tâche planifiée"
            git push -q
          fi
